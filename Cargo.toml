[package]
name = "freya"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rizukirr/Freya"
description = "A provider-neutral LLM client for Rust: one request model, several wire dialects, any compatible endpoint."
keywords = ["llm", "ai", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous"]

# The library itself needs only serialization and HTTP. It exposes `async fn`
# and never spawns, so it pulls in no runtime of its own; the caller chooses.
[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Only the examples need a runtime and a .env loader. Keeping these out of
# [dependencies] means downstream crates do not inherit them.
[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
