[package]
name = "freyja"
version = "0.5.1"
edition = "2024"
# Verified by the MSRV job in CI, not inferred from the edition. The dependency
# tree (reqwest -> url -> idna -> icu) forces at least 1.86; 1.88 is a
# deliberate margin above that floor.
rust-version = "1.88"
license = "MIT"
description = "A provider-neutral LLM client: one request model, four wire dialects, any compatible endpoint."
repository = "https://github.com/rizukirr/Freyja"
documentation = "https://docs.rs/freyja"
readme = "README.md"
keywords = ["llm", "ai", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous"]
# Repository furniture is not part of the crate. Everything else ships,
# including the README, examples and tests. The docs live on the website.
exclude = [".github/", ".gitignore"]

[workspace]
members = ["macros", "downstream"]


# The library itself needs only serialization and HTTP. It exposes `async fn`
# and never spawns, so it pulls in no runtime of its own; the caller chooses.
[dependencies]
freyja-macros = { version = "0.5.1", path = "macros" }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", features = ["json"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Only with the `tracing` feature. It is already in the tree through hyper, so
# enabling it adds no crate.
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }

# Only the examples need a runtime and a .env loader. Keeping these out of
# [dependencies] means downstream crates do not inherit them.
[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
# `freyja::Tracing`, a hook that reports every model call and tool call as a
# `tracing` event.
tracing = ["dep:tracing"]

[package.metadata.docs.rs]
all-features = true
