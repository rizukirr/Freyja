[package]
name = "freyja"
version = "0.3.0"
edition = "2024"
# Verified by the MSRV job in CI, not inferred from the edition. The dependency
# tree (reqwest -> url -> idna -> icu) forces at least 1.86; 1.88 is a
# deliberate margin above that floor.
rust-version = "1.88"
license = "MIT"
description = "A provider-neutral LLM client: one request model, four wire dialects, any compatible endpoint."
repository = "https://github.com/rizukirr/Freyja"
documentation = "https://docs.rs/freyja"
readme = "README.md"
keywords = ["llm", "ai", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "asynchronous"]
# Repository furniture is not part of the crate. Everything else ships,
# including `docs/`, so a vendored copy carries its own documentation.
exclude = [".github/", ".gitignore"]

[workspace]
members = ["macros"]


# The library itself needs only serialization and HTTP. It exposes `async fn`
# and never spawns, so it pulls in no runtime of its own; the caller chooses.
[dependencies]
freyja-macros = { version = "0.3.0", path = "macros" }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", features = ["json"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Only the examples need a runtime and a .env loader. Keeping these out of
# [dependencies] means downstream crates do not inherit them.
[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true
