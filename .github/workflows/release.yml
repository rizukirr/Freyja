name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

env:
  CARGO_TERM_COLOR: always

# There is deliberately no publish job. crates.io is uploaded to by hand, and
# the order is not optional: `cargo package` strips the path from the
# freyja-macros dependency and leaves the version, so the macro crate has to be
# published before the root crate resolves.
#
#   cargo publish -p freyja-macros
#   cargo publish -p freyja

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --all-targets
      - run: cargo test --all-features

  package:
    name: Package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Refuse to release a tag that disagrees with Cargo.toml.
      - name: Check tag matches the crate version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate="v$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "tag $tag does not match Cargo.toml $crate"
            exit 1
          fi

      # A library's distributable is the .crate file, the same archive
      # cargo publish uploads. There is no executable to ship.
      - run: cargo package
      - name: Attach the crate archive to the release
        run: gh release upload "${{ inputs.tag || github.ref_name }}" target/package/*.crate --clobber
        env:
          GH_TOKEN: ${{ github.token }}
