name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

env:
  CARGO_TERM_COLOR: always

# There is deliberately no publish job. crates.io is uploaded to by hand, from
# a maintainer's machine, with `scripts/release.sh` — so no registry token
# exists in this repository and no workflow can publish regardless of who
# triggers it. The script carries the publish order and the retry handling.

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --all-targets
      - run: cargo test --all-features

  package:
    name: Package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Refuse to release a tag that disagrees with either crate.
      #
      # `freyja` depends on `freyja-macros` by path locally, but `cargo package`
      # strips the path and leaves the version, so the two manifests and the
      # dependency declaration must all agree before anything is uploaded. A
      # mismatch caught here costs nothing; caught during publish it leaves a
      # public release that cannot be installed.
      - name: Check the tag matches both crate versions
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          root="v$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          macros="v$(grep '^version' macros/Cargo.toml | head -1 | cut -d'"' -f2)"
          dep="v$(grep '^freyja-macros' Cargo.toml | sed -E 's/.*version = "([^"]+)".*/\1/')"
          echo "tag=$tag root=$root macros=$macros dep=$dep"
          if [ "$tag" != "$root" ] || [ "$tag" != "$macros" ] || [ "$tag" != "$dep" ]; then
            echo "tag, Cargo.toml, macros/Cargo.toml and the freyja-macros dependency must all agree"
            exit 1
          fi

      # A library's distributable is the .crate file, the same archive
      # cargo publish uploads. There is no executable to ship.
      - run: cargo package
      - name: Attach the crate archive to the release
        run: gh release upload "${{ inputs.tag || github.ref_name }}" target/package/*.crate --clobber
        env:
          GH_TOKEN: ${{ github.token }}
