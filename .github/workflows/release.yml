name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --all-targets
      - run: cargo test --all-features

  package:
    name: Package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Refuse to release a tag that disagrees with either crate.
      #
      # `freyja` depends on `freyja-macros` by path locally, but `cargo package`
      # strips the path and leaves the version, so the two manifests and the
      # dependency declaration must all agree before anything is uploaded. A
      # mismatch caught here costs nothing; caught during publish it leaves a
      # public release that cannot be installed.
      - name: Check the tag matches both crate versions
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          root="v$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          macros="v$(grep '^version' macros/Cargo.toml | head -1 | cut -d'"' -f2)"
          dep="v$(grep '^freyja-macros' Cargo.toml | sed -E 's/.*version = "([^"]+)".*/\1/')"
          echo "tag=$tag root=$root macros=$macros dep=$dep"
          if [ "$tag" != "$root" ] || [ "$tag" != "$macros" ] || [ "$tag" != "$dep" ]; then
            echo "tag, Cargo.toml, macros/Cargo.toml and the freyja-macros dependency must all agree"
            exit 1
          fi

      # A library's distributable is the .crate file, the same archive
      # cargo publish uploads. There is no executable to ship.
      - run: cargo package
      - name: Attach the crate archive to the release
        run: gh release upload "${{ inputs.tag || github.ref_name }}" target/package/*.crate --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish to crates.io
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # Skipped silently when the token is not configured, so tagging a release
      # does not fail for anyone who has not set the secret.
      #
      # This is a two-crate workspace and the order is not optional. `freyja`
      # depends on `freyja-macros` by version once `cargo package` strips the
      # path, so the macro crate has to exist on crates.io first or the root
      # crate is rejected against a version that was never uploaded.
      - name: Publish freyja-macros
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          # crates.io is append-only, so a run that uploads the macro crate and
          # then fails leaves that version permanently taken. Treat an existing
          # version as success so re-running the workflow resumes rather than
          # dead-ending on a version number that can never be reused. Any other
          # failure still fails the job.
          if output=$(cargo publish -p freyja-macros 2>&1); then
            echo "$output"
          else
            echo "$output"
            echo "$output" | grep -qE 'already (exists|uploaded)' || exit 1
            echo "freyja-macros at this version is already published; continuing."
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish freyja
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p freyja
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
