name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

env:
  CARGO_TERM_COLOR: always

# There is deliberately no publish job. crates.io is uploaded to by hand, and
# the order is not optional: `cargo package` strips the path from the
# freyja-macros dependency and leaves the version, so the macro crate has to be
# published before the root crate resolves.
#
#   cargo publish -p freyja-macros
#   cargo publish -p freyja

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --all-targets
      - run: cargo test --all-features

  package:
    name: Package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Refuse to release a tag that disagrees with any of the three places a
      # version is written. `cargo package` strips the path from the
      # freyja-macros dependency and leaves the version, so a release where the
      # pin lags publishes a crate that resolves against something nobody
      # uploaded. Checking only the root manifest would let that through.
      - name: Check every version agrees with the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          root="v$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          macros="v$(grep '^version' macros/Cargo.toml | head -1 | cut -d'"' -f2)"
          pin="v$(grep '^freyja-macros = ' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')"
          mismatched=0
          for pair in "Cargo.toml=$root" "macros/Cargo.toml=$macros" "the freyja-macros pin=$pin"; do
            name="${pair%%=*}"
            value="${pair##*=}"
            if [ "$tag" != "$value" ]; then
              echo "tag $tag does not match $name ($value)"
              mismatched=1
            fi
          done
          exit $mismatched

      # A library's distributable is the .crate file, the same archive
      # cargo publish uploads. There is no executable to ship.
      #
      # The macro crate packages on its own. The root crate does not until
      # freyja-macros is on crates.io at this version, because packaging
      # resolves that dependency from the registry rather than the path. So
      # publish the macro crate before tagging, or expect this step to fail
      # with a version that "didn't match".
      - run: cargo package -p freyja-macros
      - run: cargo package -p freyja
      - name: Attach the crate archives to the release
        run: gh release upload "${{ inputs.tag || github.ref_name }}" target/package/*.crate --clobber
        env:
          GH_TOKEN: ${{ github.token }}
